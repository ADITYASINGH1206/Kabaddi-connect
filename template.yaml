AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KabadiConnect - AI-Powered Informal Recycling Marketplace Backend

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment stage name
  BedrockModelId:
    Type: String
    Default: "amazon.nova-lite-v1:0"
    Description: "Amazon Bedrock multimodal model ID (e.g. amazon.nova-lite-v1:0)"
  BedrockRegion:
    Type: String
    Default: "ap-southeast-2"
    Description: "AWS Region hosting the Bedrock model (default: ap-southeast-2 Sydney)"

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:
      Variables:
        STAGE: !Ref Environment
        PHOTOS_BUCKET: !Ref PhotosBucket
        COLLECTORS_TABLE: !Ref CollectorsTable
        RATES_TABLE: !Ref RatesTable
        LISTINGS_TABLE: !Ref ListingsTable
        PICKUPS_TABLE: !Ref PickupsTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion

Resources:
  # HTTP API Gateway with CORS
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Public URL + metered services (Bedrock): cap request rate so a crawler or
      # a loop in a client cannot burn the credits.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - x-api-key
        AllowOrigins:
          - '*'
        MaxAge: 300

  # S3 Photo Bucket: Private, 7-day lifecycle, CORS for client PUT
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireScrapPhotos7Days
            Status: Enabled
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  # DynamoDB: Collectors Table (On-Demand)
  CollectorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: collectorId
          AttributeType: S
      KeySchema:
        - AttributeName: collectorId
          KeyType: HASH

  # DynamoDB: Rates Table (On-Demand)
  RatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: material
          AttributeType: S
      KeySchema:
        - AttributeName: material
          KeyType: HASH

  # DynamoDB: Listings Table (On-Demand) with GSI and Image Cache support
  ListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: listingId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: listingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # DynamoDB: Pickups Table (On-Demand)
  PickupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pickupId
          AttributeType: S
        - AttributeName: collectorId
          AttributeType: S
        - AttributeName: acceptedAt
          AttributeType: S
      KeySchema:
        - AttributeName: pickupId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: collectorId-date-index
          KeySchema:
            - AttributeName: collectorId
              KeyType: HASH
            - AttributeName: acceptedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Lambda: GET /health
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.health.handler.lambda_handler
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  # Lambda: POST /uploads (presigned PUT, JPEG only, 5 MB)
  UploadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.uploads.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub '${PhotosBucket.Arn}/*'
      Events:
        UploadsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /uploads
            Method: POST

  # Lambda: POST /analyze (Bedrock Converse multimodal, cache in DynamoDB, retries & fallback)
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.analyze.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub '${PhotosBucket.Arn}/*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ListingsTable.Arn
      Events:
        AnalyzeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analyze
            Method: POST

  # Lambda: /rates, /listings, and /listings/{id}/accept
  ListingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.listings.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt ListingsTable.Arn
                - !GetAtt RatesTable.Arn
                - !GetAtt CollectorsTable.Arn
                - !GetAtt PickupsTable.Arn
                - !Sub '${ListingsTable.Arn}/index/*'
      Events:
        RatesApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /rates
            Method: GET
        ListingsCreateApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /listings
            Method: POST
        ListingsGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /listings/{id}
            Method: GET
        ListingsAcceptApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /listings/{id}/accept
            Method: POST

  # Lambda: /collectors, /collectors/{id}/requests, /collectors/{id}/route
  CollectorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.collectors.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !GetAtt CollectorsTable.Arn
                - !GetAtt ListingsTable.Arn
                - !GetAtt RatesTable.Arn
                - !GetAtt PickupsTable.Arn
                - !Sub '${ListingsTable.Arn}/index/*'
                - !Sub '${PickupsTable.Arn}/index/*'
      Events:
        CollectorsListApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /collectors
            Method: GET
        CollectorsRequestsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /collectors/{id}/requests
            Method: GET
        CollectorsRouteApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /collectors/{id}/route
            Method: POST

  # Lambda: /pickups/{id}/complete, /pickups/{id}, /pickups
  PickupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.pickups.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt PickupsTable.Arn
                - !GetAtt ListingsTable.Arn
                - !GetAtt RatesTable.Arn
                - !Sub '${PickupsTable.Arn}/index/*'
      Events:
        PickupsCompleteApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pickups/{id}/complete
            Method: POST
        PickupsGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pickups/{id}
            Method: GET
        PickupsListApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pickups
            Method: GET

  # Lambda: GET /impact
  ImpactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.impact.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !GetAtt PickupsTable.Arn
                - !GetAtt ListingsTable.Arn
      Events:
        ImpactApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /impact
            Method: GET

  # CloudWatch Alarm: Lambda Error Rate
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alerts when KabadiConnect Lambda errors breach threshold"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Frontend S3 Bucket (Private, encrypted, accessed via CloudFront OAC)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # CloudFront Origin Access Control for Frontend S3 Bucket
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution for Frontend SPA
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: KabadiConnect Frontend Distribution
        Origins:
          - Id: FrontendBucketOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # S3 Bucket Policy allowing CloudFront OAC read access
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  HttpApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FrontendUrl:
    Description: Public CloudFront URL for the KabadiConnect Frontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Description: Name of S3 bucket for Frontend static assets
    Value: !Ref FrontendBucket
  PhotosBucketName:
    Description: Name of private S3 bucket for scrap photo uploads
    Value: !Ref PhotosBucket
  RatesTableName:
    Description: DynamoDB table name for rates
    Value: !Ref RatesTable
  ListingsTableName:
    Description: DynamoDB table name for listings
    Value: !Ref ListingsTable
  CollectorsTableName:
    Description: DynamoDB table name for collectors
    Value: !Ref CollectorsTable
  PickupsTableName:
    Description: DynamoDB table name for pickups
    Value: !Ref PickupsTable

